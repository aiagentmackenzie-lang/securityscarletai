# Production overlay for SecurityScarletAI.
#
# Usage:
#   DOMAIN=scarlet.example.com docker compose \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the dev compose:
#   - Caddy reverse proxy with automatic TLS fronts API + dashboard.
#   - API + dashboard no longer publish host ports (only Caddy exposes 80/443).
#   - The dashboard's live-reload source mount is removed (image is baked).
#   - LOG_FORMAT=json, LOG_LEVEL=WARNING for structured, lower-volume logs.
#   - Restart policies + resource limits for predictable memory use.
#
# Secrets still come from .env (DB_PASSWORD / API_SECRET_KEY / API_BEARER_TOKEN
# are required). For real production use a secrets manager (see DEPLOYMENT.md).
#
# NOTE: `volumes: !reset []` requires Docker Compose v2.20+. Verify with
# `docker compose version`.

services:
  postgres:
    # F-04: the database must not be reachable from outside the compose
    # network. The base compose publishes :5433 for host-mode dev; the
    # overlay revokes it. Only Caddy publishes ports in prod (80/443).
    ports: !reset []

  redis:
    # F-04: the prod base publishes :6379 and runs WITHOUT a password — a LAN
    # attacker could FLUSHALL the JWT blocklist and rate-limit buckets. The
    # overlay revokes the port AND enforces auth. REDIS_PASSWORD is required
    # (fail fast if unset).
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (generate: openssl rand -base64 32)}"]

  api:
    ports: !reset []
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      # Redis auth (F-04): the API talks to a requirepass'd redis in prod.
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      # Prod: do not serve OpenAPI/Swagger/ReDoc. The schema + interactive
      # docs are an unauthenticated attack-surface map; disable them.
      DOCS_ENABLED: "false"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  dashboard:
    # Remove the dev live-reload mount — bake the dashboard into the image.
    volumes: !reset []
    ports: !reset []
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SCARLET_API_URL: http://api:8000/api/v1
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    deploy:
      resources:
        limits:
          memory: 512m

  caddy:
    image: caddy:2-alpine
    container_name: scarletai-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Only 80/443 EVER publish in prod. Postgres/Redis publish NOTHING
      # (ports: !reset [] above); confirm with `docker compose ... ps`.
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_started
    environment:
      # Substitute <DOMAIN> in the Caddyfile at container start.
      DOMAIN: ${DOMAIN:?Set DOMAIN to your real hostname}
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  caddy_data:
  caddy_config: