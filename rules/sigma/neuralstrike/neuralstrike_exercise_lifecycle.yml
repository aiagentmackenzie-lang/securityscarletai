description: >
  A NeuralStrike red-team exercise started or ended on this SIEM --
  the lifecycle bookends emitted by the producer at exercise_start and
  exercise_end (one of each per exercise, source=neuralstrike,
  category=ai). This is the low-noise attribution lens -- the bookends
  define the exercise window that the purple-report join walks to
  associate NeuralGuard firewall verdicts and Scarlet alerts with the
  exercise that drove them (join key -- user_name tenant + window).
  Also the operator's receipt that planned offensive testing ran
  against a target in the window. ATT&CK tag is the nearest-neighbor
  for the simulated technique class (prompt injection), documented as
  approximate; the rule is a bookend, not an incident. Producer
  contract -- src/neuralstrike/integrations/scarletai.py.
