title: Data Exfiltration Volume
id: bdf00a5d-e640-5e0c-8e17-7f8c5812f352
status: stable
description: Detects large outbound data transfers that may indicate data exfiltration
author: SecurityScarletAI
date: 2026/05/03
logsource:
    category: network
detection:
    selection:
        event_category: network
        event_type: connection
        destination_ip: '*'
    filter_internal:
        # AUD-077: the RFC1918 172.16-31/12 private block needs PER-OCTET prefix
        # entries. The old startswith shortcuts ('172.2', '172.3') also matched the
        # PUBLIC 172.200-255 and 172.32-39 ranges, suppressing real external
        # destinations from this exfiltration detector.
        destination_ip|startswith:
            - '10.'
            - '192.168.'
            - '172.16.'
            - '172.17.'
            - '172.18.'
            - '172.19.'
            - '172.20.'
            - '172.21.'
            - '172.22.'
            - '172.23.'
            - '172.24.'
            - '172.25.'
            - '172.26.'
            - '172.27.'
            - '172.28.'
            - '172.29.'
            - '172.30.'
            - '172.31.'
    condition: selection and not filter_internal | count(*) by host_name > 50
timeframe: 1h
level: high
tags:
    - attack.exfiltration
    - attack.ta0010
    - attack.t1048