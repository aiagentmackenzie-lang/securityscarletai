title: Login from Unusual Geography
id: d0f298b8-4905-5786-a5a0-b5b1d5f54528
status: experimental
description: Detects successful authentication from an IP address that does not match expected geographic patterns
author: SecurityScarletAI
date: 2026/05/03
logsource:
    category: authentication
detection:
    selection:
        event_action|contains: success
        source_ip: '*'
    filter_internal:
        # AUD-077: the RFC1918 172.16-31/12 private block needs PER-OCTET prefix
        # entries. The old startswith shortcuts ('172.2', '172.3') also matched the
        # PUBLIC 172.200-255 and 172.32-39 ranges, suppressing real external sources.
        # 10/8 and 192.168/16 are private in full, so their prefix entries are correct.
        source_ip|startswith:
            - '10.'
            - '192.168.'
            - '172.16.'
            - '172.17.'
            - '172.18.'
            - '172.19.'
            - '172.20.'
            - '172.21.'
            - '172.22.'
            - '172.23.'
            - '172.24.'
            - '172.25.'
            - '172.26.'
            - '172.27.'
            - '172.28.'
            - '172.29.'
            - '172.30.'
            - '172.31.'
    condition: selection and not filter_internal
level: medium
tags:
    - attack.initial_access
    - attack.ta0001
    - attack.t1078