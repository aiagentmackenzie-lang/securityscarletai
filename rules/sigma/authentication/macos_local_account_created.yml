title: macOS Local Account Created (users differential)
id: 64428248-3286-474d-afad-fd2f203494e8
status: stable
description: >
    Detects creation of a local user account on macOS via the osquery
    `users` table scheduled in DIFFERENTIAL mode: osquery emits an 'added'
    row only for an account that appeared since the previous interval, and
    the parser derives the account_created vocabulary token for it (the
    same token the Windows 4720 path emits). This is the macOS half of the
    V0.6b rogue-account-creation item (T1136); the Windows half is
    windows_local_account_created. The two rules are keyed apart by the
    `source` column (osquery:users vs osquery:windows_events) so one event
    cannot fire both. HONEST BEHAVIOR NOTES (validated live on the
    reference daemon, 2026-09-14): (1) the first schedule tick after an
    osquery (re)start stores the baseline SILENTLY -- no rows are emitted
    and there is NO restart burst; a stable account set emits nothing, so
    this rule fires only when an account actually appears on the host.
    (2) logged_in_users is deliberately NOT part of this detection: utmpx
    rows are session state (auth_success/session_closed tokens) -- a login
    session is not an account creation. (3) Deleted accounts ('removed'
    rows) carry no token -- the closed vocabulary has no account_deleted
    token; the raw rows survive in raw_data. The schedule filters to
    uid >= 500 (real accounts on macOS; system accounts stay below 500).
author: SecurityScarletAI
date: 2026/09/14
logsource:
    category: authentication
detection:
    selection_users_diff:
        event_type: start
        event_action: account_created
        source: osquery:users
    condition: selection_users_diff
level: medium
tags:
    - attack.persistence
    - attack.ta0003
    - attack.t1136