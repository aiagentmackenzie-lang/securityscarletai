title: Password Spray Pattern
id: 864ea5df-a04f-528f-a993-fd6c4d6af625
status: stable
description: Detects many usernames failing auth from one source in a short window
author: SecurityScarletAI
date: 2026/08/26
logsource:
    category: authentication
detection:
    selection:
        event_action: auth_failure
    condition: selection | count(user_name) by source_ip > 30
level: high
tags:
