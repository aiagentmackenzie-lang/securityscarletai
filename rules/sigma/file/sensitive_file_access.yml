title: Sensitive File Access
id: 89097fa4-defb-5d5d-b794-0c3e218f9e6b
status: stable
description: Detects access to sensitive system files like /etc/shadow, .ssh directories, and private keys
author: SecurityScarletAI
date: 2026/05/03
logsource:
    category: file
detection:
    selection_access:
        event_action: file_opened
        file_path|contains:
            - /etc/shadow
            - .ssh/id_rsa
            - .ssh/authorized_keys
            - /etc/krb5.keytab
    selection_hosts_modified:
        event_action: file_modified
        file_path|contains: /etc/hosts
    condition: selection_access or selection_hosts_modified
level: high
tags:
    - attack.credential_access
    - attack.ta0006
    - attack.t1003