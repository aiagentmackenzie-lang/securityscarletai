title: Browser Credential Store Access
id: 3430e115-a4ef-5df6-a3df-d8ebef04a50e
status: stable
description: Detects access to browser-stored credential databases
author: SecurityScarletAI
date: 2026/08/26
logsource:
    category: file
detection:
    selection:
        file_path|contains:
            - Login Data
            - Cookies.db
            - logins.json
            - key4.db
    condition: selection
level: medium
tags:
