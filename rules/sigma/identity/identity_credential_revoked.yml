title: Identity Signal Credential Revoked or Deleted
id: 6c9e5f12-8d47-4b3a-a1c5-2f9b6e0d7a84
status: stable
description: >
    A configured IdP transmitter (SSF/CAEP) signed and delivered a
    credential-change SET with change_type revoke or delete: the identity
    provider asserts that a credential was revoked or deleted (password,
    FIDO2, certificate, OTP). The response-relevant leg of the credential
    lifecycle. The ATT&CK mapping is nearest-neighbor, documented as
    approximate. Producer contract: src/ingestion/ssf.py (source=ssf,
    category=identity) — severity_for_event() maps revoke|delete to HIGH,
    create|update to medium, so this rule selects the severity: high leg
    (a real logs column; raw_data JSONB fields are not a Sigma-selectable
    column) and create/update events deliberately do NOT select.
author: SecurityScarletAI
date: 2026/09/16
logsource:
    category: identity
detection:
    selection_action:
        event_category: identity
        event_action: identity_credential_change
    selection_high:
        severity: high
    condition: selection_action and selection_high
level: high
tags:
    - attack.credential_access
    - attack.ta0006
    - attack.t1552