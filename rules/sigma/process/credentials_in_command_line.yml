title: Credentials Passed on Command Line
id: 8cb093da-3942-5669-bddd-980de3c61e00
status: stable
description: Detects password-like strings passed on a process command line
author: SecurityScarletAI
date: 2026/08/26
logsource:
    category: process
detection:
    selection:
        process_cmdline|contains:
            - password=
            - passwd=
            - --password
    condition: selection
level: medium
tags:
    - attack.credential_access
    - attack.ta0006
    - attack.t1552
