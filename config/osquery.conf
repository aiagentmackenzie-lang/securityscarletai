{
  "options": {
    "schedule_splay_percent": "10",
    "worker_threads": "2",
    "host_identifier": "hostname",
    "disable_events": "false",
    "verbose": "false",
    "disable_endpointsecurity": "false",
    "disable_endpointsecurity_fim": "false",
    "enable_file_events": "true"
  },
  "schedule": {
    "processes": {
      "query": "SELECT pid, name, path, cmdline, uid, gid, parent, start_time, resident_size FROM processes;",
      "interval": 60,
      "description": "All running processes - differential mode detects new process launches"
    },
    "listening_ports": {
      "query": "SELECT lp.pid, lp.port, lp.protocol, lp.address, p.name, p.path FROM listening_ports lp JOIN processes p ON lp.pid = p.pid WHERE lp.address != '127.0.0.1';",
      "interval": 120,
      "description": "Network listeners excluding localhost - detects backdoors and C2 beacons"
    },
    "logged_in_users": {
      "query": "SELECT type, user, host, time, pid FROM logged_in_users;",
      "interval": 60,
      "description": "Active sessions - session-state only; auth failures come from the auth shipper (V0.3)"
    },
    "open_sockets": {
      "query": "SELECT pid, remote_address, remote_port, local_address, local_port, protocol FROM process_open_sockets WHERE remote_address != '' AND remote_address != '::' AND remote_address != '0.0.0.0';",
      "interval": 60,
      "description": "Active network connections - critical for C2 and exfil detection"
    },
    "shell_history": {
      "query": "SELECT uid, time, command, history_file FROM shell_history WHERE command != '';",
      "interval": 600,
      "description": "Command history - post-exploitation detection. osquery 5.x: column is uid (username does not exist); uid maps to user_name in OSQUERY_ECS_MAP"
    },
    "crontab": {
      "query": "SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;",
      "interval": 300,
      "description": "Scheduled tasks - persistence mechanism detection"
    },
    "startup_items": {
      "query": "SELECT name, path, source, status, username FROM startup_items;",
      "interval": 300,
      "description": "Login items and launch agents - persistence detection. Needs Full Disk Access on macOS (Background Task Management dir); without FDA returns empty"
    },
    "launchd_entries": {
      "query": "SELECT name, label, program, program_arguments, run_at_load FROM launchd WHERE run_at_load = '1';",
      "interval": 300,
      "description": "LaunchDaemons/Agents set to auto-run - macOS persistence"
    },
    "disk_encryption": {
      "query": "SELECT name, encrypted, type, uid, encrypted, filevault_status FROM disk_encryption WHERE encrypted = 1;",
      "interval": 3600,
      "description": "FileVault status - compliance check. Intentionally NOT in OSQUERY_ECS_MAP (compliance table, dropped by parser as unmapped - P2-37)"
    },
    "sip_config": {
      "query": "SELECT config_flag, enabled, enabled_nvram FROM sip_config WHERE config_flag = 'sip';",
      "interval": 3600,
      "description": "System Integrity Protection master flag - osquery 5.x schema is config_flag/enabled/enabled_nvram (no version column)"
    },
    "user_ssh_keys": {
      "query": "SELECT uid, path, encrypted FROM user_ssh_keys;",
      "interval": 3600,
      "description": "SSH keys - monitors for unauthorized key creation"
    },
    "file_events": {
      "query": "SELECT target_path, action, transaction_id, inode, uid, gid, mode, size, atime, mtime, ctime, md5, sha1, sha256, time FROM file_events;",
      "interval": 60,
      "description": "FIM events for watched path sets (see file_events.files above)"
    }
  },
  "file_paths": {
    "launchagents": [
      "/Users/%/Library/LaunchAgents/%%",
      "/Library/LaunchAgents/%%",
      "/Library/LaunchDaemons/%%"
    ],
    "ssh_credentials": [
      "/Users/%/.ssh/%%"
    ],
    "tmp_staging": [
      "/tmp/%%",
      "/var/tmp/%%"
    ],
    "system_log_paths": [
      "/var/log/%%"
    ]
  },
  "exclude_paths": {
    "tmp_staging": [
      "/tmp/osquery%",
      "/var/tmp/osquery%"
    ]
  }
}