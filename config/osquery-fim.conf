{
  "_comment": "V0.3 FIM overlay -- VALIDATED 2026-09-11 via root LaunchDaemon scratch pass (file_events live-verified on osquery 5.23.1: sha256 + action + path sets all captured; promoted into osquery.conf). Config truths learned in live-fire: (1) watched paths use top-level file_paths/exclude_paths keys, NOT file_events.files; (2) enable_file_events must be true (default false); (3) disable_endpointsecurity + disable_endpointsecurity_fim must be false; (4) EndpointSecurity requires ROOT (LaunchDaemon) and a root-owned binary outside user-writable paths; (5) AUD-073 comment correction: es_process_events (ES process telemetry) IS parsed by the SIEM now (schemas.py maps it, event_category process / event_type start; parser consumes it) and is SCHEDULED in osquery.conf (the promoted config) -- process_events itself remains OpenBSM-backed and empty on macOS 10.15+, so this overlay does not schedule it; this file documents the FIM overlay shape only.",
  "options": {
    "schedule_splay_percent": "10",
    "worker_threads": "2",
    "host_identifier": "hostname",
    "disable_events": "false",
    "verbose": "false",
    "disable_endpointsecurity": "false",
    "disable_endpointsecurity_fim": "false",
    "enable_file_events": "true"
  },
  "schedule": {
    "processes": {
      "query": "SELECT pid, name, path, cmdline, uid, gid, parent, start_time, resident_size FROM processes;",
      "interval": 60,
      "description": "All running processes - differential mode detects new process launches"
    },
    "file_events": {
      "query": "SELECT target_path, action, transaction_id, inode, uid, gid, mode, size, atime, mtime, ctime, md5, sha1, sha256, time FROM file_events;",
      "interval": 60,
      "description": "FIM events for watched path sets (see file_paths/exclude_paths below)"
    },
    "listening_ports": {
      "query": "SELECT lp.pid, lp.port, lp.protocol, lp.address, p.name, p.path FROM listening_ports lp JOIN processes p ON lp.pid = p.pid WHERE lp.address != '127.0.0.1';",
      "interval": 120,
      "description": "Network listeners excluding localhost - detects backdoors and C2 beacons"
    },
    "open_sockets": {
      "query": "SELECT pid, remote_address, remote_port, local_address, local_port, protocol FROM process_open_sockets WHERE remote_address != '' AND remote_address != '::' AND remote_address != '0.0.0.0';",
      "interval": 60,
      "description": "Active network connections - critical for C2 and exfil detection"
    },
    "logged_in_users": {
      "query": "SELECT type, user, host, time, pid FROM logged_in_users;",
      "interval": 60,
      "description": "Active sessions - session-state only; auth failures come from the auth shipper (V0.3)"
    }
  },
  "file_paths": {
    "launchagents": [
      "/Users/%/Library/LaunchAgents/%%",
      "/Library/LaunchAgents/%%",
      "/Library/LaunchDaemons/%%"
    ],
    "ssh_credentials": [
      "/Users/%/.ssh/%%"
    ],
    "tmp_staging": [
      "/tmp/%%",
      "/var/tmp/%%"
    ],
    "system_log_paths": [
      "/var/log/%%"
    ]
  },
  "exclude_paths": {
    "tmp_staging": [
      "/tmp/osquery%",
      "/var/tmp/osquery%"
    ]
  }
}