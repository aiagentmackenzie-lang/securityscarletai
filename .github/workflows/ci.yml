name: CI

on:
  push:
    branches: [main]  # polish-and-docs trigger removed 2026-09-02: branch deleted (merged)
  pull_request:
    branches: [main]

jobs:  # P2-38: build the Docker image so Dockerfile breakage (stale COPYs, bad
  # entrypoint, dependency install failures) is caught instead of slipping
  # through a test-only gate. No secrets required.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: securityscarletai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image boots its entrypoint
        # P0-05 class: assert the app imports without crashing at load. We run
        # under `python -c import src.api.main` with dummy env that satisfies the
        # Settings validators — import does NOT connect to a DB, so no service is
        # needed. This catches stale COPYs/bad imports that `docker build` alone
        # can't (build only checks file presence, not runtime import).
        run: |
          docker run --rm --entrypoint python \
            -e DB_PASSWORD=dummypassword123456 \
            -e API_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e API_BEARER_TOKEN=dummybearertoken1234 \
            securityscarletai:ci -c "import src.api.main; print('import ok')"

      - name: Boot the real entrypoint against a live Postgres
        # 2026-09-03 slim-image regression: the slim build dropped psql and
        # curl; `import ok` passed while the entrypoint crash-looped on schema
        # apply (psql: command not found) and compose healthchecks failed.
        # This gate runs the ACTUAL entrypoint against a real Postgres and
        # requires the API to come up and serve /health — the boot path, not
        # just the import path. /health returns 200 with status "degraded"
        # when Ollama is absent, so no Ollama service is needed here.
        run: |
          docker network create ci-boot
          docker run -d --name ci-db --network ci-boot \
            -e POSTGRES_DB=scarletai -e POSTGRES_USER=scarletai \
            -e POSTGRES_PASSWORD=cibootpassword \
            postgres:17-alpine
          docker run -d --name ci-api --network ci-boot \
            -e DB_HOST=ci-db -e DB_PORT=5432 -e DB_NAME=scarletai \
            -e DB_USER=scarletai -e DB_PASSWORD=cibootpassword \
            -e API_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e API_BEARER_TOKEN=dummybearertoken1234 \
            securityscarletai:ci
          ok=""
          for i in $(seq 1 120); do
            if docker exec ci-api python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)" 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          docker logs ci-api 2>&1 | tail -40
          if [ -z "$ok" ]; then
            echo "::error::entrypoint never reached a healthy API (see logs above)"
            exit 1
          fi
          # The exact regression: schema must actually be applied (psql existed
          # and the statement-by-statement apply completed on a fresh volume).
          tables=$(docker exec ci-db psql -U scarletai -d scarletai -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables after boot: $tables"
          if [ "$tables" -lt 5 ]; then
            echo "::error::schema not applied during boot"
            exit 1
          fi
          docker rm -f ci-api ci-db
          docker network rm ci-boot

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scarletai
          POSTGRES_USER: scarletai
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # P2-38: point the app's settings.db_* at the provisioned service and
    # ungate the integration tests. The app reads settings.db_* (not
    # DATABASE_URL); the integration conftest gates on RUN_INTEGRATION_TESTS.
    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: scarletai
      DB_USER: scarletai
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
      API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        # --no-root matches the Dockerfile: the project is an app (src-layout,
        # package-mode=false), not a distributable package, so we install only
        # the locked dependencies and import `src` by path.
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install poetry
          poetry install --no-root

      - name: Lint
        # Full pyproject config (E,F,W,I,S,B with S608/B008 ignored).
        # Gates the product code (src + dashboard).
        run: poetry run ruff check src/ dashboard/

      - name: Lint tooling (scripts + tests)
        # F-23: scripts/ + tests/ were a 158-error blind spot — they now gate
        # with the per-file-ignores in pyproject (S311/S108 seeding, E501 data
        # lines, S603/S607 test subprocess).
        run: poetry run ruff check scripts/ tests/

      - name: Type check
        # Pragmatic mypy config (see [tool.mypy] in pyproject.toml). Not
        # `strict` — strict produced 336 unenforced errors (a false signal).
        # This config is actually green; tighten incrementally over time.
        run: poetry run mypy src

      - name: Apply schema (ON_ERROR_STOP=1)
        # P2-30/P2-38: apply the canonical schema to the provisioned
        # Postgres with ON_ERROR_STOP=1 so a broken/partial apply fails the
        # job loudly instead of reporting success while tables are missing.
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h localhost -p 5433 -U scarletai -d scarletai \
            -v ON_ERROR_STOP=1 -f src/db/schema.sql

      - name: Unit tests and coverage
        # Single gate: coverage IS the unit test run. Previously this ran
        # twice (once bare, once with --cov). Consolidated per B1.
        run: poetry run pytest tests/unit/ -q --cov=src --cov-fail-under=80 --tb=short -q

      - name: Integration tests
        # P2-38: integration tests run against the provisioned Postgres with
        # the schema applied. Previously they silently skipped (no
        # DATABASE_URL/RUN_INTEGRATION_TESTS) while CI stayed green — the
        # systemic reason every P0 slipped through.
        run: poetry run pytest tests/integration/ -v


  # P3.5: dependency vulnerability audit (pip-audit) over the locked
  # dependency set installed in the same venv as the test job.
  # POLICY: NON-BLOCKING for the first two weeks after Phase 3 (continue-on-
  # error below) so pre-existing findings don't gate the remediation pipeline.
  # Flip to enforcing in a follow-up once the initial findings are triaged
  # into .trivyignore / dependency bumps — tracked as P3.5 follow-up.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true # P3.5 policy: advisory until findings triaged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (locked set)
        # Same --no-root install as the test job: pip-audit then audits the
        # exact locked dependency set the app actually runs on.
        run: |
          pip install poetry
          poetry install --no-root

      - name: pip-audit (locked dependency set)
        run: |
          poetry run pip install pip-audit
          poetry run pip-audit --skip-editable

  # P3.5: image vulnerability scan of the built Docker image (OS packages +
  # Python site-packages) with Trivy. HIGH/CRITICAL exit-code 1 — but the
  # JOB is non-blocking per the same two-week policy as dependency-audit.
  # Accepted risks live in .trivyignore (each entry: CVE + rationale + date;
  # entries without rationale must not be added).
  trivy-image-scan:
    runs-on: ubuntu-latest
    continue-on-error: true # P3.5 policy: non-blocking first, enforce in follow-up
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t securityscarletai:ci .

      - name: Trivy image scan (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: securityscarletai:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore