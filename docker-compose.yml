services:
  postgres:
    image: postgres:17-alpine
    # (platform pin removed — F-26: it forced arm64 and broke x86 hosts.)
    container_name: scarletai-db
    environment:
      POSTGRES_USER: scarletai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: scarletai
    ports:
      # Port 5433 to avoid conflict with Homebrew PostgreSQL on macOS
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scarletai -d scarletai"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    # Epic 4: Redis service for rate-limit storage and JWT blocklist.
    # 6379 inside the compose network; not exposed to host by default.
    # (platform pin removed — F-26: it forced linux/arm64 and broke x86 hosts.)
    #
    # DEV note: no password here (local single-user dev, port published for
    # host-mode `poetry run`). PRODUCTION MUST SET A PASSWORD — the prod
    # overlay enforces --requirepass and rewrites REDIS_URL accordingly
    # (see docker-compose.prod.yml + DEPLOYMENT.md "Redis auth").
    image: redis:7-alpine
    container_name: scarletai-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: scarletai-api
    # Epic 7: run the entrypoint that waits for DB, applies schema, seeds, trains, then execs uvicorn.
    command: ["/app/scripts/entrypoint.sh"]
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scarletai
      DB_USER: scarletai
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?Set API_BEARER_TOKEN in .env}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8501}
      # Hardcoded for the compose network: .env's REDIS_URL is the host-mode
      # value (for `poetry run`), and must NOT leak into the container via
      # ${REDIS_URL:-...} or the API can't reach Redis (rate-limit middleware crash).
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Demo seed is opt-in (Phase 1, 2026-09-01): the entrypoint only seeds
      # demo alerts + the demo credential when this is explicitly "true".
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Hardcoded: Ollama runs on the host, reached via host.docker.internal from
      # the container. .env's http://localhost:11434 is the host-mode value.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b}
    volumes:
      # Epic 7: persist model artifacts and runtime data across restarts.
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Longer start-period: the entrypoint runs schema apply + optional seed + model
      # training on first launch, which can take 30-60 seconds.
      # 2026-09-03: was `curl -f` — curl is NOT in the slim image (Phase C dropped
      # it with the build toolchain), so a perfectly healthy API reported unhealthy
      # and every dependent service refused to start. Python-stdlib probe, matching
      # the image's own HEALTHCHECK. /health returns 200 even when Ollama is down
      # (status becomes "degraded"), so this gate is API+DB liveness only.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=8)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped  # M-18: restart policy added

  dashboard:
    # Epic 10: Streamlit dashboard. Reuses the API image (same Python deps,
    # same source tree mounted). When DASHBOARD_API_TOKEN is set, the
    # dashboard authenticates to the API as a service — no manual login
    # required. When unset, the dashboard falls back to the JWT login flow.
    build: .
    container_name: scarletai-dashboard
    command: ["streamlit", "run", "dashboard/main.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false", "--theme.base=dark", "--theme.primaryColor=#00bcd4", "--theme.backgroundColor=#090c14", "--theme.secondaryBackgroundColor=#0f1420", "--theme.textColor=#e8ecf1"]
    ports:
      - "8501:8501"
    environment:
      # Inside the compose network the API is reachable at http://api:8000
      SCARLET_API_URL: http://api:8000/api/v1
      # Optional static bearer. If blank, the dashboard requires user login.
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-}
      # Operator bootstrap notes on the login screen (default off — keep the
      # front door clean). Set to 1/true to show the "Initial setup" expander.
      DASHBOARD_SHOW_SETUP_HELP: ${DASHBOARD_SHOW_SETUP_HELP:-}
      # Streamlit settings — make the container reachable from the host browser
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      # Mount source so streamlit reloads on code changes during dev.
      # In production, remove this and bake the image at build time.
      - ./dashboard:/app/dashboard
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The shared image's HEALTHCHECK pings :8000/api/v1/health (the API),
      # but this container runs Streamlit on 8501 — so the inherited check
      # always fails and the container shows (unhealthy) in `docker ps`.
      # Override with Streamlit's own health endpoint.
      # 2026-09-03: was `curl -f` — curl is not in the slim image (same
      # regression as the api check). Python-stdlib probe instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
